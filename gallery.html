<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Фотогалерея | VivOlive Trattoria</title>

    <link rel="stylesheet" href="gallery.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="container">

        <!-- ================= HEADER ================= -->

        <header>

            <div class="logo">
                <a href="index.html">
                    <img src="img/logo.png" alt="VivOlive Trattoria">
                </a>
            </div>

            <nav>
                <a href="index.html">ГОЛОВНА</a>
                <a href="menu.html">МЕНЮ</a>
                <a href="products.html">НАШІ ПРОДУКТИ</a>
                <a href="woodfire.html">ДРОВ'ЯНА ПІЧ</a>
                <a href="gallery.html" class="active">ФОТОГАЛЕРЕЯ</a>
                <a href="contacts.html">КОНТАКТИ</a>
            </nav>

            <a href="reservation.html" class="header-button">
                ЗАБРОНЮВАТИ
            </a>

        </header>

        <!-- ================= MAIN ================= -->

        <main>

            <p class="gallery-eyebrow">Archivio Fotografico</p>

            <h1 class="gallery-title">
                Фотогалерея
            </h1>

            <p class="gallery-subtitle">
                Кожна світлина — це частина атмосфери VivOlive Trattoria, де поєднуються затишок, італійські традиції
                та мистецтво гастрономії.
            </p>

            <div class="gallery-divider" aria-hidden="true">
                <svg viewBox="0 0 220 24" xmlns="http://www.w3.org/2000/svg">
                    <line x1="0" y1="12" x2="85" y2="12" stroke="currentColor" stroke-width="1" />
                    <path d="M110 4 C118 4 124 8 124 12 C124 16 118 20 110 20 C102 20 96 16 96 12 C96 8 102 4 110 4 Z"
                        fill="currentColor" opacity="0.85" />
                    <circle cx="110" cy="12" r="2.2" fill="#F8F6F2" />
                    <line x1="135" y1="12" x2="220" y2="12" stroke="currentColor" stroke-width="1" />
                </svg>
            </div>

            <section class="gallery-card">

                <div class="gallery-grid">

                    <!-- Высокая вертикальная -->
                    <div class="photo vertical">
                        <img src="img/gallery1.png" alt="Фото ресторану">
                    </div>

                    <!-- Квадрат -->
                    <div class="photo square">
                        <img src="img/restaurant.png" alt="Фото ресторану">
                    </div>

                    <!-- Квадрат -->
                    <div class="photo square">
                        <img src="img/gallery2.png" alt="Фото ресторану">
                    </div>

                    <!-- Немного выше квадрата -->
                    <div class="photo medium">
                        <img src="img/gallery4.png" alt="Фото ресторану">
                    </div>

                    <!-- Горизонтальная -->
                    <div class="photo horizontal">
                        <img src="img/gallery6.png" alt="Фото ресторану">
                    </div>

                    <!-- Квадрат -->
                    <div class="photo square">
                        <img src="img/gallery7.png" alt="Фото ресторану">
                    </div>

                    <!-- Квадрат -->
                    <div class="photo square">
                        <img src="img/gallery8.png" alt="Фото ресторану">
                    </div>

                    <!-- Квадрат -->
                    <div class="photo square">
                        <img src="img/gallery3.png" alt="Фото ресторану">
                    </div>

                    <!-- Квадрат -->
                    <div class="photo square">
                        <img src="img/gallery5.png" alt="Фото ресторану">
                    </div>

                </div>

            </section>

        </main>

    </div>

</html>
